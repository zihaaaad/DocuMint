[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documint"
version = "3.0.0"
description = "Universal Document Automation & Batch Dispatch Engine in Python (Excel/Word to PDF, Multi-Threaded SMTP/Outlook Dispatch, Local SQLite Analytics)"
authors = [
  { name="Zihad Hasan", email="pkmzihad@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "python-docx>=0.8.11",
    "pywin32>=306; sys_platform == 'win32'",
    "openpyxl>=3.1.0",
    "flask>=3.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
documint = "documint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-p no:faulthandler"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
